spring.application.name=prabhim
server.port=${PORT:8090}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# H2 In-Memory Database Configuration for Test Execution (PostgreSQL Mode)
spring.datasource.url=jdbc:h2:mem:prabhimfit_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SMTP Mail Configuration (Mock/Stub for tests)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.test-connection=false
